# Hourly heal crumb — the safety net BETWEEN daily sessions.

# The gate RUNs only when an open grid slot would expire before the
# next 08:30 UTC session could claim it (a missed session, a quota
# window that cleared early). It then heals those holes in one go.
# Otherwise SKIP — a seconds-long no-op ~99% of the time.

name: hourly-heal

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: clip-factory
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: read            # fetch bank artifacts from the harvest run

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/gate.py --event "${{ github.event_name }}" --actor "${{ github.actor }}" | tee gate.txt
      - id: verdict
        run: echo "verdict=$(head -1 gate.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}

  factory:
    needs: gate
    if: needs.gate.outputs.verdict == 'RUN'
    runs-on: ubuntu-latest
    timeout-minutes: 120      # a heal can fill several slots at once
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg + deps + deno
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet -r requirements.txt
          # yt-dlp's JS runtime for YouTube's web client (2026-11-11).
          curl -fsSL https://deno.com/install.sh | sh \
            || echo "::warning::deno install failed — web client may lose formats"
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
      - name: Bank check (is a banked clip waiting?)
        id: bank
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          ready, name, run_id = "false", "", ""
          p = Path("data/bank_pointer.json")
          if p.exists():
              try:
                  ptr = json.loads(p.read_text())
                  st = json.loads(Path("data/state.json").read_text())
                  clips = (st.get("bank") or {}).get("clips") or []
                  if clips and ptr.get("artifact") and ptr.get("run_id"):
                      ready, name = "true", ptr["artifact"]
                      run_id = str(ptr["run_id"])
              except Exception as e:
                  print("bank check failed:", e)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"ready={ready}\nname={name}\nrun-id={run_id}\n")
          PY

      - name: Fetch the banked clips
        if: steps.bank.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          # pattern, not name: the bank ships as parts (-p1/-p2/...)
          # in one run; a legacy single artifact matches too. (The
          # exact-name fetch broke on parts 2026-11-15 and silently
          # fell to the live ladder — fixed.)
          pattern: ${{ steps.bank.outputs.name }}*
          merge-multiple: true
          run-id: ${{ steps.bank.outputs.run-id }}
          path: bank_month
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true   # any failure -> live ladder, never starve

      - name: Run the factory
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          COOKIES_TXT: ${{ secrets.COOKIES_TXT }}
          COOKIES_TXT2: ${{ secrets.COOKIES_TXT2 }}
          COOKIES_TXT3: ${{ secrets.COOKIES_TXT3 }}
          BANK_ARTIFACT_DIR: bank_month
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then
            echo "::warning::YT_REFRESH_TOKEN not set yet - waiting for the one-time Google authorization. Skipping."
            exit 0
          fi
          python main.py 2>&1 | tee factory.log

      - name: Stamp the media-cache artifact name
        if: ${{ !cancelled() }}
        id: mcache
        run: echo "name=media-cache-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Cache published media for the reels cross-poster
        # heal-published Shorts get reels too (owner rule 2026-11-15)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mcache.outputs.name }}
          path: media_cache
          retention-days: 30
          if-no-files-found: ignore

      - name: File an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('factory.log', 'utf8').slice(-3000); } catch (e) {}
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Machine failure (heal) ${new Date().toISOString().slice(0,16)}`,
              body: `\`\`\`\n${log.slice(-1500)}\n\`\`\``, labels: ['machine-failure']
            });
      - name: Commit memory back
        if: always()
        run: |
          git config user.name "fort-clip-factory"
          git config user.email "actions@github.com"
          git add -A data ingest 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "memory unchanged"
          else
            # git must never line-merge state.json: the crosspost job
            # of this same run may have pushed fresher memory from its
            # own runner. Union the writers field-by-field instead
            # (tools/merge_state.py, post-mortem 2026-11-15 17:42).
            cp data/state.json /tmp/ours.json
            git fetch --quiet origin main
            git checkout origin/main -- data/state.json 2>/dev/null || true
            if [ -f data/state.json ]; then
              python tools/merge_state.py /tmp/ours.json data/state.json --prefer core --inplace data/state.json
              cp data/state.json data/state.json.bak
            else
              cp /tmp/ours.json data/state.json
            fi
            git add -A data ingest
            git commit -m "memory: heal run" || true
            git push || true
          fi

  crosspost:
    # OWNER RULE (2026-11-15): every Short -> YouTube Short + Instagram
    # Reel + Facebook Reel — the SAME mp4. Runs EVERY hour (independent
    # of the gate verdict): at each 6-hour grid slot (00/06/12/18 Cairo)
    # it fetches the cached video back and pushes it to Meta's
    # resumable-upload endpoints minutes after the YouTube twin goes
    # live. Failures retry next hour and NEVER touch the YouTube
    # pipeline. Unarmed platforms (missing token/id) are cleanly OFF.
    needs: [gate, factory]     # strictly after any factory work in this
                               # run — never two state writers at once
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 45      # due reels + backfill burst (yt-dlp
                              # downloads + uploads + possible yuv420p
                              # re-encodes + yt description updates)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg + deps + deno
        # ffmpeg: yt-dlp merge + yuv420p re-encodes; yt-dlp[default]:
        # the EJS challenge-solver + deno runtime — the backfill rides
        # the SAME proven ladder as the factory job (cookies x client
        # rotation); without them YouTube bot-gates the runner
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet PyYAML "yt-dlp[default]"
          curl -fsSL https://deno.com/install.sh | sh \
            || echo "::warning::deno install failed — web client may lose formats"
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
      - name: Cross-post due Shorts + backfill the catalogue
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          FB_ACCESS_TOKEN: ${{ secrets.FB_ACCESS_TOKEN }}
          TIKTOK_ACCESS_TOKEN: ${{ secrets.TIKTOK_ACCESS_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          COOKIES_TXT: ${{ secrets.COOKIES_TXT }}
          COOKIES_TXT2: ${{ secrets.COOKIES_TXT2 }}
          COOKIES_TXT3: ${{ secrets.COOKIES_TXT3 }}
        run: |
          # freshness first: the factory job of THIS run pushed its
          # memory seconds before this job's checkout fetched
          # (live-diagnosed 2026-11-15 17:40 — a 2 s miss). Pull the
          # newest state before reading it; clean by construction
          # (no local changes yet).
          git pull --ff-only origin main || true
          python -m src.crosspost --due 2>&1 | tee crosspost.log
          python -m src.crosspost --backfill 2>&1 | tee -a crosspost.log
      - name: File an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('crosspost.log', 'utf8').slice(-3000); } catch (e) {}
            const alerts = log.split('\n').filter(l =>
              l.includes('ALERT') || l.includes('FAILED')).slice(0, 20).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Crosspost failure ${new Date().toISOString().slice(0, 16).replace('T', ' ')}`,
              body: `The reels cross-poster failed.\n\n\`\`\`\n${alerts || log.slice(-1500) || 'no log'}\n\`\`\``,
              labels: ['machine-failure']
            });
      - name: Commit memory back (merge, never line-conflict)
        if: always()
        run: |
          git config user.name "fort-clip-factory"
          git config user.email "actions@github.com"
          git add -A data 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "memory unchanged"
            exit 0
          fi
          # POST-MORTEM 2026-11-15 17:42: `git pull --rebase
          # --autostash` popped into a state.json conflict, the commit
          # died, `|| true` swallowed it — this job's reels vanished
          # from state and the next run re-posted them as duplicates.
          # Now: take origin's freshest state.json, union OUR crosspost
          # fields onto it (tools/merge_state.py), push the merge.
          cp data/state.json /tmp/ours.json
          git fetch --quiet origin main
          git checkout origin/main -- data/state.json 2>/dev/null || true
          if [ -f data/state.json ]; then
            python tools/merge_state.py /tmp/ours.json data/state.json --prefer crosspost --inplace data/state.json
            cp data/state.json data/state.json.bak
          else
            cp /tmp/ours.json data/state.json
          fi
          git add -A data
          git commit -m "memory: crosspost run" || true
          if ! git push --quiet 2>/dev/null; then
            # someone pushed between fetch and push — merge once more
            cp data/state.json /tmp/ours2.json
            git fetch --quiet origin main
            git checkout origin/main -- data/state.json
            python tools/merge_state.py /tmp/ours2.json data/state.json --prefer crosspost --inplace data/state.json
            cp data/state.json data/state.json.bak
            git add -A data
            git commit -m "memory: crosspost run (re-merged)" || true
            git push --quiet || echo "::warning::memory push lost the race twice — next run re-reads origin"
          fi
