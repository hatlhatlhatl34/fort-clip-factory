# Hourly heal crumb — the safety net BETWEEN daily sessions.

# The gate RUNs only when an open grid slot would expire before the
# next 08:30 UTC session could claim it (a missed session, a quota
# window that cleared early). It then heals those holes in one go.
# Otherwise SKIP — a seconds-long no-op ~99% of the time.

name: hourly-heal

on:
  schedule:
    - cron: "0 * * * *"
  workflow_dispatch: {}

concurrency:
  group: clip-factory
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: read            # fetch bank artifacts from the harvest run

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/gate.py --event "${{ github.event_name }}" --actor "${{ github.actor }}" | tee gate.txt
      - id: verdict
        run: echo "verdict=$(head -1 gate.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}

  factory:
    needs: gate
    if: needs.gate.outputs.verdict == 'RUN'
    runs-on: ubuntu-latest
    timeout-minutes: 120      # a heal can fill several slots at once
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg + deps + deno
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet -r requirements.txt
          # yt-dlp's JS runtime for YouTube's web client (2026-11-11).
          curl -fsSL https://deno.com/install.sh | sh \
            || echo "::warning::deno install failed — web client may lose formats"
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
      - name: Bank check (is a banked clip waiting?)
        id: bank
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          ready, name, run_id = "false", "", ""
          p = Path("data/bank_pointer.json")
          if p.exists():
              try:
                  ptr = json.loads(p.read_text())
                  st = json.loads(Path("data/state.json").read_text())
                  clips = (st.get("bank") or {}).get("clips") or []
                  if clips and ptr.get("artifact") and ptr.get("run_id"):
                      ready, name = "true", ptr["artifact"]
                      run_id = str(ptr["run_id"])
              except Exception as e:
                  print("bank check failed:", e)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"ready={ready}\nname={name}\nrun-id={run_id}\n")
          PY

      - name: Fetch the banked clips
        if: steps.bank.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.bank.outputs.name }}
          run-id: ${{ steps.bank.outputs.run-id }}
          path: bank_month
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true   # any failure -> live ladder, never starve

      - name: Run the factory
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          COOKIES_TXT: ${{ secrets.COOKIES_TXT }}
          COOKIES_TXT2: ${{ secrets.COOKIES_TXT2 }}
          COOKIES_TXT3: ${{ secrets.COOKIES_TXT3 }}
          BANK_ARTIFACT_DIR: bank_month
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then
            echo "::warning::YT_REFRESH_TOKEN not set yet - waiting for the one-time Google authorization. Skipping."
            exit 0
          fi
          python main.py 2>&1 | tee factory.log
      - name: File an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('factory.log', 'utf8').slice(-3000); } catch (e) {}
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Machine failure (heal) ${new Date().toISOString().slice(0,16)}`,
              body: `\`\`\`\n${log.slice(-1500)}\n\`\`\``, labels: ['machine-failure']
            });
      - name: Commit memory back
        if: always()
        run: |
          git config user.name "fort-clip-factory"
          git config user.email "actions@github.com"
          git add -A data ingest 2>/dev/null || true
          git diff --cached --quiet || (git commit -m "memory: heal run" && git push) || true
