# Hourly heal crumb — the safety net BETWEEN daily sessions.

# The gate RUNs only when an open grid slot would expire before the
# next 08:33 UTC session could claim it (a missed session, a quota
# window that cleared early). It then heals those holes in one go.
# Otherwise SKIP — a seconds-long no-op ~99% of the time.
#
# 2026-11-18 SPLIT: the crosspost job moved to its OWN workflow
# (crosspost-hour.yml, concurrency group "crosspost") after the
# live-diagnosed starvation — a delayed monthly-harvest held the
# clip-factory group through the 22:00 UTC grid slot and short #30
# sat live on YouTube with zero reels for hours. Reel posting no
# longer serializes behind factory/harvest runs. This workflow keeps
# the gate + factory jobs only.

name: hourly-heal

on:
  schedule:
    # off-minute: GitHub's most congested minutes are :00/:30 — the
    # old "0 * * * *" lost whole runs to cron skipping (no heal fired
    # between 18:04 and 21:33 on 2026-11-17)
    - cron: "17 * * * *"
  workflow_dispatch: {}

concurrency:
  # OWNER RULE (2026-11-22): PUBLISHING NEVER STOPS — the heal must
  # never queue behind a ~5h monthly-harvest in the old shared
  # "clip-factory" group (live starvation 2026-11-22: the 16:02Z heal
  # sat queued until auto-cancelled by the pending daily session,
  # while the 15:53Z harvest held the group for hours). "publish"
  # is shared with daily-factory ONLY — the factory workflows still
  # serialize with EACH OTHER (no double slot-booking), but never
  # with the harvest. Same fix pattern as the 2026-11-18 crosspost
  # split above.
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: read            # fetch bank artifacts from the harvest run

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5      # D7 (audit 2026-11-18): a hung gate must
                            # never hold the clip-factory group 6h
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -o pipefail    # A2 (audit 2026-11-18): gate crash = red
                            # step, never hidden behind tee
          python tools/gate.py --event "${{ github.event_name }}" --actor "${{ github.actor }}" | tee gate.txt
      - id: verdict
        run: echo "verdict=$(head -1 gate.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}

  factory:
    needs: gate
    if: needs.gate.outputs.verdict == 'RUN'
    runs-on: ubuntu-latest
    timeout-minutes: 120      # a heal can fill several slots at once
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ffmpeg + deps + deno
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install --quiet -r requirements.txt
          # yt-dlp's JS runtime for YouTube's web client (2026-11-11).
          curl -fsSL https://deno.com/install.sh | sh \
            || echo "::warning::deno install failed — web client may lose formats"
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"
      - name: Bank check (is a banked clip waiting?)
        id: bank
        run: |
          python - <<'PY'
          import json, os, time
          from datetime import datetime, timezone
          from pathlib import Path
          ready, name, run_id = "false", "", ""
          p = Path("data/bank_pointer.json")
          if p.exists():
              try:
                  ptr = json.loads(p.read_text())
                  st = json.loads(Path("data/state.json").read_text())
                  bank = st.get("bank") or {}
                  clips = bank.get("clips") or []
                  started = (bank.get("harvest_started_ts") or "").strip()
                  # OWNER RULE (2026-11-21): a bank is served only
                  # inside its 62-day feeding horizon (2-month bank);
                  # aged-out clips are never fetched (and the
                  # orchestrator retires them at run time anyway).
                  try:
                      t0 = (datetime.fromisoformat(
                            started.replace("Z", "+00:00")).timestamp()
                          if started else 0.0)
                  except ValueError:
                      t0 = 0.0
                  if t0:
                      within = time.time() < t0 + 62 * 86400
                  elif bank.get("month"):
                      now_m = datetime.now(timezone.utc).strftime("%Y-%m")
                      by, bmo = map(int, bank["month"].split("-"))
                      ny, nmo = map(int, now_m.split("-"))
                      within = (ny - by) * 12 + (nmo - bmo) < 2
                  else:
                      within = False
                  if clips and not within:
                      print(f"[bank] AGED-OUT bank (month="
                            f"{bank.get('month') or '-'} — past its "
                            "62-day horizon, owner rule 2026-11-21) — "
                            "never published; live ladder this run")
                  elif clips and ptr.get("artifact") and ptr.get("run_id"):
                      ready, name = "true", ptr["artifact"]
                      run_id = str(ptr["run_id"])
              except Exception as e:
                  print("bank check failed:", e)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"ready={ready}\nname={name}\nrun-id={run_id}\n")
          PY

      - name: Fetch the banked clips
        if: steps.bank.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          # pattern, not name: the bank ships as parts (-p1/-p2/...)
          # in one run; a legacy single artifact matches too. (The
          # exact-name fetch broke on parts 2026-11-15 and silently
          # fell to the live ladder — fixed.)
          pattern: ${{ steps.bank.outputs.name }}*
          merge-multiple: true
          run-id: ${{ steps.bank.outputs.run-id }}
          path: bank_month
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true   # any failure -> live ladder, never starve

      - name: Stamp the media-cache artifact name
        # A5 (audit 2026-11-18): stamped at session START (see
        # daily-factory.yml) — the after-factory stamp mismatched a
        # midnight-crossing session's pre-midnight shorts
        id: mcache
        run: echo "name=media-cache-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Run the factory
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          COOKIES_TXT: ${{ secrets.COOKIES_TXT }}
          COOKIES_TXT2: ${{ secrets.COOKIES_TXT2 }}
          COOKIES_TXT3: ${{ secrets.COOKIES_TXT3 }}
          COOKIES_TXT4: ${{ secrets.COOKIES_TXT4 }}
          BANK_ARTIFACT_DIR: bank_month
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then
            echo "::warning::YT_REFRESH_TOKEN not set yet - waiting for the one-time Google authorization. Skipping."
            exit 0
          fi
          set -o pipefail    # A2 (audit 2026-11-18): python crash must
                            # fail the step so the alert issue fires
          python main.py 2>&1 | tee factory.log

      - name: Cache published media for the reels cross-poster
        # heal-published Shorts get reels too (owner rule 2026-11-15)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mcache.outputs.name }}
          path: media_cache
          retention-days: 30
          if-no-files-found: ignore

      - name: File an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('factory.log', 'utf8').slice(-3000); } catch (e) {}
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `Machine failure (heal) ${new Date().toISOString().slice(0,16)}`,
              body: `\`\`\`\n${log.slice(-1500)}\n\`\`\``, labels: ['machine-failure']
            });
      - name: Commit memory back
        if: always()
        run: |
          git config user.name "fort-clip-factory"
          git config user.email "actions@github.com"
          git add -A data ingest 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "memory unchanged"
            exit 0
          fi
          # D1 (audit 2026-11-18): the old dance committed on the
          # session-start HEAD and `git push || true` swallowed the
          # whole heal's memory on a lost race — the next heal then
          # re-filled an already-filled slot (duplicate Short).
          # Rebuild on fresh origin/main + retries, same as the
          # daily machine.
          for i in 1 2 3 4 5; do
            cp data/state.json /tmp/ours.json 2>/dev/null || true
            git fetch --quiet origin main
            # D2 (live fix 2026-11-18): --soft kept the STALE session
            # tree staged — a workflow file that lands while this run
            # sits queued (its checkout predates the file) rides into
            # the memory commit as a DELETION and GitHub rejects the
            # whole push ("refusing to allow a GitHub App to create or
            # update workflow ... without workflows permission") — a
            # green session went red with its memory lost (harvest
            # run 44288392287). --hard rebuilds the tree on fresh
            # origin/main first (mid-run commits preserved), OUR data
            # memory goes on top: the memory commit can only ever
            # touch data/ + ingest/ — zero workflow surface.
            git reset --hard origin/main
            git checkout origin/main -- data/state.json 2>/dev/null || true
            if [ -f data/state.json ]; then
              python tools/merge_state.py /tmp/ours.json data/state.json --prefer core --inplace data/state.json
              cp data/state.json data/state.json.bak
            else
              cp /tmp/ours.json data/state.json
            fi
            git add -A data ingest
            git commit -m "memory: heal run" || true
            if git push --quiet origin HEAD:main; then
              echo "memory pushed (attempt $i)"
              exit 0
            fi
            echo "::warning::memory push lost the race (attempt $i) — rebuilding on fresh origin"
            sleep $((i * 4))   # let the racer finish before the retry
          done
          echo "::error::memory push failed 5x — watch data/state.json; the next heal reconciles"
          exit 1
