name: daily-clip-factory

# The main machine. OWNER RULE (2026-11-14): ONE upload session per
# day — 08:33 UTC (10:33 Cairo, right after the Pacific-midnight
# quota reset; the :33 minute dodges GitHub's worst cron congestion —
# the old 08:30 runs fired as late as 17:46 UTC on 2026-11-17). The
# single session uploads ALL FOUR Shorts of the day at once, each
# with publishAt = its 6-hour grid slot
# (01:00 / 07:00 / 13:00 / 19:00 Cairo — one Short every 6 hours,
# 6+6+6+6 = 24h, 4/day every day; the phase is US-tuned, owner rule
# 2026-11-23: 6 PM / midnight / 6 AM / noon US East). No more 4
# separate runs.
# Keep in sync with channel.yaml schedule.daily_run_utc AND
# tools/gate.py DAILY_FIRE_UTC.
on:
  schedule:
    - cron: "33 8 * * *"   # THE daily session (UTC)
  workflow_dispatch: {}

concurrency:
  # OWNER RULE (2026-11-22): PUBLISHING NEVER STOPS — the daily
  # session must never queue behind a ~5h monthly-harvest in the
  # old shared "clip-factory" group (live starvation 2026-11-22:
  # this session sat PENDING 16:36Z->behind the 15:53Z harvest).
  # "publish" is shared with hourly-heal ONLY — the factory
  # workflows still serialize with EACH OTHER (no double
  # slot-booking), but never with the harvest.
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: read            # fetch bank artifacts from the harvest run

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5      # D7 (audit 2026-11-18): a hung gate
                            # held the clip-factory group for 6h
                            # (default timeout) and starved the day
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -o pipefail    # A2 (audit 2026-11-18): a gate crash must
                            # fail the step, never hide behind tee
          python tools/gate.py --event "${{ github.event_name }}" --actor "${{ github.actor }}" | tee gate.txt
      - id: verdict
        run: echo "verdict=$(head -1 gate.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}

  factory:
    needs: gate
    if: needs.gate.outputs.verdict == 'RUN'
    runs-on: ubuntu-latest
    timeout-minutes: 120      # 4 Shorts in one session (bank pops
                              # are fast; live-ladder fallback needs
                              # download+render time x4)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg + deps + deno
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          # yt-dlp's JS runtime for YouTube's web client (2026-11-11:
          # without it the web attempt dies "No supported JavaScript
          # runtime could be found" before cookies even matter).
          curl -fsSL https://deno.com/install.sh | sh \
            || echo "::warning::deno install failed — web client may lose formats"
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Bank check (is a banked clip waiting?)
        id: bank
        run: |
          python - <<'PY'
          import json, os, time
          from datetime import datetime, timezone
          from pathlib import Path
          ready, name, run_id = "false", "", ""
          p = Path("data/bank_pointer.json")
          if p.exists():
              try:
                  ptr = json.loads(p.read_text())
                  st = json.loads(Path("data/state.json").read_text())
                  bank = st.get("bank") or {}
                  clips = bank.get("clips") or []
                  started = (bank.get("harvest_started_ts") or "").strip()
                  # OWNER RULE (2026-11-21): aged-out bank clips are
                  # POISON — a bank is served only inside its 62-day
                  # feeding horizon (2-month bank); clips banked for a
                  # horizon that has passed are never published (and
                  # the orchestrator retires it at run time anyway).
                  try:
                      t0 = (datetime.fromisoformat(
                            started.replace("Z", "+00:00")).timestamp()
                          if started else 0.0)
                  except ValueError:
                      t0 = 0.0
                  if t0:
                      within = time.time() < t0 + 62 * 86400
                  elif bank.get("month"):
                      now_m = datetime.now(timezone.utc).strftime("%Y-%m")
                      by, bmo = map(int, bank["month"].split("-"))
                      ny, nmo = map(int, now_m.split("-"))
                      within = (ny - by) * 12 + (nmo - bmo) < 2
                  else:
                      within = False
                  if clips and not within:
                      print(f"[bank] AGED-OUT bank (month="
                            f"{bank.get('month') or '-'} — past its "
                            "62-day horizon, owner rule 2026-11-21) — "
                            "never published; live ladder this run")
                  elif clips and ptr.get("artifact") and ptr.get("run_id"):
                      ready, name = "true", ptr["artifact"]
                      run_id = str(ptr["run_id"])
              except Exception as e:
                  print("bank check failed:", e)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"ready={ready}\nname={name}\nrun-id={run_id}\n")
          PY

      - name: Fetch the banked clips
        if: steps.bank.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          # pattern, not name: the bank ships as parts (-p1/-p2/...)
          # in one run; a legacy single artifact matches too.
          pattern: ${{ steps.bank.outputs.name }}*
          merge-multiple: true
          run-id: ${{ steps.bank.outputs.run-id }}
          path: bank_month
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true   # any failure -> live ladder, never starve

      - name: Stamp the media-cache artifact name
        # A5 (audit 2026-11-18): stamped at session START — a session
        # crossing UTC midnight stamps D while its post-midnight shorts
        # carry D+1 in state (cache_video stamps per short at publish
        # time); the old after-factory stamp mismatched the MAJORITY
        # of a crossing session's shorts instead of the rare tail
        id: mcache
        run: echo "name=media-cache-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

      - name: Run the factory
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          COOKIES_TXT: ${{ secrets.COOKIES_TXT }}
          COOKIES_TXT2: ${{ secrets.COOKIES_TXT2 }}
          COOKIES_TXT3: ${{ secrets.COOKIES_TXT3 }}
          COOKIES_TXT4: ${{ secrets.COOKIES_TXT4 }}
          BANK_ARTIFACT_DIR: bank_month
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then
            echo "::warning::YT_REFRESH_TOKEN not set yet - the machine is armed but waiting for the one-time Google authorization (RUNBOOK.md step 3). Skipping this run."
            exit 0
          fi
          set -o pipefail
          python main.py 2>&1 | tee factory.log

      - name: Cache published media for the reels cross-poster
        # owner rule 2026-11-15: the SAME Short -> YouTube + Instagram
        # Reel + Facebook Reel. The session copies each published final
        # into media_cache/ (src/crosspost.py cache_video); this step
        # ships it as the artifact state.shorts[].media points at. The
        # hourly heal fetches it back at slot time and pushes the bytes
        # to Meta's resumable-upload endpoints.
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.mcache.outputs.name }}
          path: media_cache
          retention-days: 30
          if-no-files-found: ignore

      - name: File an issue on failure (never fail silently)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('factory.log', 'utf8').slice(-3000); } catch (e) {}
            const alerts = log.split('\n').filter(l =>
              l.includes('ALERT') || l.includes('ERROR')).slice(0, 20).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Machine failure ${new Date().toISOString().slice(0, 16).replace('T', ' ')}`,
              body: `The clip factory run failed.\n\n\`\`\`\n${alerts || log.slice(-1500) || 'no log'}\n\`\`\`\n\nSee the run log for the full trace.`,
              labels: ['machine-failure']
            });

      - name: Commit memory back (keeps Actions alive forever)
        if: always()
        run: |
          git config user.name "fort-clip-factory"
          git config user.email "actions@github.com"
          git add -A data ingest 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "memory unchanged"
            exit 0
          fi
          # D1 (audit 2026-11-18): the old dance committed on the
          # session-start HEAD — any push from another workflow while
          # this session rendered made git push non-fast-forward and
          # `|| true` silently discarded the ENTIRE session's memory
          # (shorts records, slot bookings, bank pops, pointer
          # retirements). Rebuild the commit on fresh origin/main
          # (reset --soft keeps OUR staged work, including consumed
          # ingest drops), union state through merge_state, push —
          # with retries, never silent.
          for i in 1 2 3 4 5; do
            cp data/state.json /tmp/ours.json 2>/dev/null || true
            git fetch --quiet origin main
            # D2 (live fix 2026-11-18): --soft kept the STALE session
            # tree staged — a workflow file that lands while this run
            # sits queued (its checkout predates the file) rides into
            # the memory commit as a DELETION and GitHub rejects the
            # whole push ("refusing to allow a GitHub App to create or
            # update workflow ... without workflows permission") — a
            # green session went red with its memory lost (harvest
            # run 44288392287). --hard rebuilds the tree on fresh
            # origin/main first (mid-run commits preserved), OUR data
            # memory goes on top: the memory commit can only ever
            # touch data/ + ingest/ — zero workflow surface.
            git reset --hard origin/main
            git checkout origin/main -- data/state.json 2>/dev/null || true
            if [ -f data/state.json ]; then
              python tools/merge_state.py /tmp/ours.json data/state.json --prefer core --inplace data/state.json
              cp data/state.json data/state.json.bak
            else
              cp /tmp/ours.json data/state.json
            fi
            git add -A data ingest
            git commit -m "memory: $(date -u +%Y-%m-%d) run" || true
            if git push --quiet origin HEAD:main; then
              echo "memory pushed (attempt $i)"
              exit 0
            fi
            echo "::warning::memory push lost the race (attempt $i) — rebuilding on fresh origin"
            sleep $((i * 4))   # let the racer finish before the retry
          done
          echo "::error::memory push failed 5x — watch data/state.json; the next run reconciles"
          exit 1
