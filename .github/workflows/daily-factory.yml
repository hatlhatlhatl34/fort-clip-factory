name: daily-clip-factory

# The main machine. OWNER RULE (2026-11-13): ONE upload session per
# day — 08:30 UTC (10:30 Cairo, right after the Pacific-midnight
# quota reset). The single session uploads ALL FOUR Shorts of the
# day at once, each with publishAt = its grid slot (00:00 / 08:00 /
# 16:00 / 20:00 Cairo, 4/day every day). No more 4 separate runs.
on:
  schedule:
    - cron: "30 8 * * *"   # THE daily session (UTC)
  workflow_dispatch: {}

concurrency:
  group: clip-factory
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  actions: read            # fetch bank artifacts from the harvest run

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python tools/gate.py --event "${{ github.event_name }}" --actor "${{ github.actor }}" | tee gate.txt
      - id: verdict
        run: echo "verdict=$(head -1 gate.txt | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}

  factory:
    needs: gate
    if: needs.gate.outputs.verdict == 'RUN'
    runs-on: ubuntu-latest
    timeout-minutes: 120      # 4 Shorts in one session (bank pops
                              # are fast; live-ladder fallback needs
                              # download+render time x4)
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg + deps + deno
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt
          # yt-dlp's JS runtime for YouTube's web client (2026-11-11:
          # without it the web attempt dies "No supported JavaScript
          # runtime could be found" before cookies even matter).
          curl -fsSL https://deno.com/install.sh | sh \
            || echo "::warning::deno install failed — web client may lose formats"
          echo "$HOME/.deno/bin" >> "$GITHUB_PATH"

      - name: Bank check (is a banked clip waiting?)
        id: bank
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          ready, name, run_id = "false", "", ""
          p = Path("data/bank_pointer.json")
          if p.exists():
              try:
                  ptr = json.loads(p.read_text())
                  st = json.loads(Path("data/state.json").read_text())
                  clips = (st.get("bank") or {}).get("clips") or []
                  if clips and ptr.get("artifact") and ptr.get("run_id"):
                      ready, name = "true", ptr["artifact"]
                      run_id = str(ptr["run_id"])
              except Exception as e:
                  print("bank check failed:", e)
          with open(os.environ["GITHUB_OUTPUT"], "a") as fh:
              fh.write(f"ready={ready}\nname={name}\nrun-id={run_id}\n")
          PY

      - name: Fetch the banked clips
        if: steps.bank.outputs.ready == 'true'
        uses: actions/download-artifact@v4
        with:
          name: ${{ steps.bank.outputs.name }}
          run-id: ${{ steps.bank.outputs.run-id }}
          path: bank_month
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true   # any failure -> live ladder, never starve

      - name: Run the factory
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          COOKIES_TXT: ${{ secrets.COOKIES_TXT }}
          COOKIES_TXT2: ${{ secrets.COOKIES_TXT2 }}
          COOKIES_TXT3: ${{ secrets.COOKIES_TXT3 }}
          BANK_ARTIFACT_DIR: bank_month
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then
            echo "::warning::YT_REFRESH_TOKEN not set yet - the machine is armed but waiting for the one-time Google authorization (RUNBOOK.md step 3). Skipping this run."
            exit 0
          fi
          set -o pipefail
          python main.py 2>&1 | tee factory.log

      - name: File an issue on failure (never fail silently)
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('factory.log', 'utf8').slice(-3000); } catch (e) {}
            const alerts = log.split('\n').filter(l =>
              l.includes('ALERT') || l.includes('ERROR')).slice(0, 20).join('\n');
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Machine failure ${new Date().toISOString().slice(0, 16).replace('T', ' ')}`,
              body: `The clip factory run failed.\n\n\`\`\`\n${alerts || log.slice(-1500) || 'no log'}\n\`\`\`\n\nSee the run log for the full trace.`,
              labels: ['machine-failure']
            });

      - name: Commit memory back (keeps Actions alive forever)
        if: always()
        run: |
          git config user.name "fort-clip-factory"
          git config user.email "actions@github.com"
          git add -A data ingest 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "memory unchanged"
          else
            git commit -m "memory: $(date -u +%Y-%m-%d) run" || true
            git push || true
          fi
