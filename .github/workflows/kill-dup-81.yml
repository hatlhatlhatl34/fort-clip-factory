name: kill-dup-81

# ONE-TIME (owner rule 2026-11-23): delete Short #81 — a duplicate of
# #76. Both were sibling cuts of ONE archive.org April-2025 item-shop
# video; the derivative identifier suffix (_202504) defeated the
# exact-match mined() check, so the same footage was banked and
# scheduled twice. tools/kill_short.py:
#   1. deletes the video flclQkSGilw from YouTube (50 units, honest),
#   2. cleans the ledger (drops the record, unbooks the slot).
# NO replacement upload: bank clip n=82 (Whoods, AFK XP map) already
# owns the freed 06:00 Cairo slot — the machine fills it normally.
# The same push hardens mined() (derivative-suffix folding) and
# bank.take_next (poison-clip skip) so this never recurs.
# Re-fires are idempotent zero-cost no-ops via the state marker.

on:
  workflow_dispatch: {}

concurrency:
  # owner rule 2026-11-22: publishing ops serialize together and
  # NEVER queue behind a harvest
  group: publish
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  kill:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install deps
        run: |
          python -m pip install --quiet --upgrade pip
          pip install --quiet -r requirements.txt

      - name: Kill the duplicate
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
        run: |
          if [ -z "$YT_REFRESH_TOKEN" ]; then
            echo "::error::YT_REFRESH_TOKEN not set — cannot delete"
            exit 1
          fi
          set -o pipefail    # a crash must fail the step loudly
          python tools/kill_short.py 2>&1 | tee kill.log

      - name: File an issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let log = '';
            try { log = fs.readFileSync('kill.log', 'utf8').slice(-3000); } catch (e) {}
            await github.rest.issues.create({
              owner: context.repo.owner, repo: context.repo.repo,
              title: `kill-dup-81 failure ${new Date().toISOString().slice(0,16)}`,
              body: `\`\`\`\n${log.slice(-1500)}\n\`\`\``,
              labels: ['machine-failure']
            });

      - name: Commit memory back
        if: always()
        run: |
          git config user.name "fort-clip-factory"
          git config user.email "actions@github.com"
          git add -A data ingest 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "memory unchanged"
            exit 0
          fi
          # D1 race-safe dance (same as every state writer): rebuild on
          # fresh origin/main + union-merge so a push race can never
          # swallow the kill marker or the surgery.
          for i in 1 2 3 4 5; do
            cp data/state.json /tmp/ours.json 2>/dev/null || true
            git fetch --quiet origin main
            # D2 (live fix 2026-11-18): --hard rebuilds the tree on fresh
            # origin/main first, OUR data memory goes on top: the memory
            # commit can only ever touch data/ + ingest/ — zero workflow
            # surface.
            git reset --hard origin/main
            git checkout origin/main -- data/state.json 2>/dev/null || true
            if [ -f data/state.json ]; then
              python tools/merge_state.py /tmp/ours.json data/state.json --prefer core --inplace data/state.json
              cp data/state.json data/state.json.bak
            else
              cp /tmp/ours.json data/state.json
            fi
            git add -A data ingest
            git commit -m "memory: kill duplicate short #81 (owner rule 2026-11-23)" || true
            if git push --quiet origin HEAD:main; then
              echo "memory pushed (attempt $i)"
              exit 0
            fi
            echo "::warning::memory push lost the race (attempt $i) — rebuilding on fresh origin"
            sleep $((i * 4))   # let the racer finish before the retry
          done
          echo "::error::memory push failed 5x — the next heal reconciles"
          exit 1
