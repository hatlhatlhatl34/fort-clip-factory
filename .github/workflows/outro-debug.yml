name: outro-debug
# Round 4 (2026-11-23 ~18:20 UTC): the fix is LIVE on main (commit
# 74d20ef — concat demuxer + concat-filter-free card render). This
# round runs the REAL src/outro.py code path on real banked clips with
# the runner's ffmpeg 8.0.1. Expected: "[outro] 5s outro card
# appended" and a healthy +5s duration on every clip.
on:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install ffmpeg then print version
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          ffmpeg -version | head -2

      - name: Resolve the bank pointer
        id: ptr
        run: |
          python - <<'PY'
          import json, os
          ptr = json.load(open('data/bank_pointer.json'))
          print('pointer:', ptr)
          with open(os.environ['GITHUB_OUTPUT'], 'a') as fh:
              fh.write(f"artifact={ptr['artifact']}\n")
              fh.write(f"run-id={ptr['run_id']}\n")
          PY

      - name: Fetch the banked clips
        uses: actions/download-artifact@v4
        with:
          pattern: ${{ steps.ptr.outputs.artifact }}*
          merge-multiple: true
          run-id: ${{ steps.ptr.outputs.run-id }}
          path: bank_month
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      - name: Pick clips
        run: |
          find bank_month -name '*.mp4' -printf '%p\n' | head -3 > /tmp/clips.txt
          wc -l /tmp/clips.txt; cat /tmp/clips.txt

      - name: REAL code path — src/outro.py apply()
        run: |
          python - <<'PY' 2>&1
          import pathlib, subprocess, sys
          clips = [l.strip() for l in pathlib.Path('/tmp/clips.txt').read_text().splitlines() if l.strip()]
          if not clips:
              print('NO CLIPS FOUND'); sys.exit(0)
          sys.path.insert(0, '.')
          from src import outro

          for p in clips:
              print(f'\n############ CLIP {p} ############')
              import time; t0 = time.time()
              out = outro.apply(pathlib.Path(p))
              dt = time.time() - t0
              print(f'RESULT: {out}  ({dt:.0f}s)')
              if str(out).endswith('_og.mp4'):
                  d = subprocess.run(['ffprobe','-v','error','-show_entries','format=duration',
                                      '-of','csv=p=0',str(out)],capture_output=True,text=True)
                  s = subprocess.run(['ffprobe','-v','error','-show_entries','format=duration',
                                      '-of','csv=p=0',p],capture_output=True,text=True)
                  print(f'   duration: clip {s.stdout.strip()}s -> with outro {d.stdout.strip()}s '
                        f'(+{float(d.stdout.strip() or 0)-float(s.stdout.strip() or 0):.1f}s expected +5)')
                  # the last frame must BE the owner card
                  r = subprocess.run(['ffmpeg','-y','-loglevel','error','-sseof','-0.3',
                                      '-i',str(out),'-frames:v','1','/tmp/last.png'],
                                     capture_output=True,text=True)
                  if r.returncode == 0:
                      print('   last frame extracted for visual check: /tmp/last.png')
                  print('   >>> OUTRO OK — the owner card is on the end of this clip')
              else:
                  print('   >>> OUTRO FAILED — see OUTRO-ALERT above')
          PY
