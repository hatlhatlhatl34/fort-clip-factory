# ══════════════════════════════════════════════════════════════════
#  FORT CLIP FACTORY — machine DNA
#  Clips REAL Fortnite map gameplay videos from YouTube into vertical
#  Shorts that carry the map code + creator code, first frame to last.
# ══════════════════════════════════════════════════════════════════

channel:
  name: "Fort Clip Factory"
  language: "en"                      # English titles, descriptions, tags
  niche: "Fortnite creative map clips"

# ── THE CODES (the whole point of the machine) ──────────────────────
codes:
  map_code: "1789-8528-6429"          # big top bar, every frame
  creator_code: "H15"                 # footer bar, every frame
  # OWNER RULE (2026-11-13): titles are pure HOOKS now — the map code
  # NEVER appears in a Short title (it lives in the description + the
  # burned-in top bar). show_in_title stays false forever.
  show_in_title: false
  show_in_description: true           # ...and the description

# ── SOURCING RULES (owner rules, 2026-11-10) ───────────────────────
sources:
  # OWNER RULE: source videos must be at most 11 months old. The API
  # call is born with publishedAfter = now - max_age_days, so older
  # footage can never even enter the candidate pool.
  max_age_days: 334                   # ~11 months, hard filter
  # OWNER RULE (2026-11-10): clip from NORMAL videos only, never from
  # Shorts. YouTube Shorts max out at 3 minutes, so a source of at
  # least 4 minutes can never be a Short — the machine mines a fresh
  # horizontal gameplay video and converts the window into a Short.
  min_duration_s: 240                 # ≥4 min = a real video, never a Short
  max_duration_s: 5400                # skip 3-hour marathons
  # OWNER RULE (2026-11-10, quality fix): a source file below this
  # height (144p/360p garbage, tiny archive mirrors) is rejected —
  # the ladder falls through to the next rung instead of shipping a
  # mushy Short. 720 is the floor; the download ladder prefers up
  # to 1440p for a crisp 1080x1920 re-render.
  min_source_height: 720              # hard quality floor for ANY rung
  # OWNER RULE: rotate different search phrasings, not one query.
  # Each run picks the next phrasing (round-robin seeded by the day).
  # OWNER RULE (2026-11-10, sample-1 approval): XP-map gameplay is the
  # preferred niche — 6 of 16 queries target XP maps so most footage
  # looks like the map the codes promote.
  queries:
    - "fortnite xp map gameplay"
    - "fortnite xp farm map"
    - "fortnite xp map"
    - "fortnite afk xp map gameplay"
    - "fortnite xp map code"
    - "fortnite xp farming gameplay"
    - "fortnite creative map"
    - "fortnite map"
    - "fortnite map gameplay"
    - "fortnite creative map gameplay"
    - "UEFN map gameplay"
    - "fortnite deathrun gameplay"
    - "fortnite edit course gameplay"
    - "fortnite horror map gameplay"
    - "best fortnite creative maps"
    - "fortnite parkour map gameplay"
  orders: ["date", "viewCount", "relevance"]   # mixed per run
  results_per_search: 25
  # never re-clip the same source video twice, ever
  no_repeat_sources: true

# ── CLIP ENGINE ─────────────────────────────────────────────────────
clip:
  # OWNER RULE (2026-11-10): Shorts must run at least 40-45 s — 20 s
  # was too low. Floor = 45 s, ceiling = 120 s (2 minutes).
  target_len_s: [45, 120]             # the Short's length window
  min_motion_score: 12.0              # reject near-static windows
  scene_threshold: 0.28               # ffmpeg scene-change sensitivity
  max_clips_per_run: 4                # owner rule 2026-11-13: 4 Shorts
                                      # per daily session (one upload
                                      # session schedules the day)

# ── THE BANK (owner idea 2026-11-11): the monthly food run ──────────
# One IP, one long session, once a month: download + clip a whole
# month of Shorts at once (sliced downloads, human pacing, cookie-jar
# rotation), bank them in a GitHub artifact, and let the daily runs
# do ONLY the API upload (OAuth is never IP-flagged). Blocked by the
# bot wall? The guard cron retries daily until it gets through, and
# the live ladder keeps publishing meanwhile.
harvest:
  max_clips: 124              # 4/day x 31 days (owner rule 2026-11-13)
  slice_s: 300               # seconds of source grabbed per video
  pacing_s: [10, 35]         # human-ish pause between downloads
  days_ahead: 31             # planning window
  budget_minutes: 325        # fits the 350-min workflow cap; ~2-3
                             # guard sessions fill a whole month
  refill_threshold: 8        # guard refills when clips drop below this

# ── TRANSFORMATION (this is what makes it OUR video) ────────────────
transform:
  width: 1080
  height: 1920                        # 9:16 vertical Short
  zoom: 1.08                          # slight push-in: not a raw crop
  strip_audio: true                   # original audio is DISCARDED
  fps: 30

# ── OVERLAYS (first frame to last, no gaps) ─────────────────────────
overlay:
  top_bar_height: 300                 # px of the 1920 canvas
  top_label: "MAP CODE"
  footer_bar_height: 240
  footer_label: "CREATOR CODE"
  accent: "#FFD400"                   # Fortnite-ish gold
  bar_opacity: 205                    # ~80% black bars
  pulse: false                        # static = readable in every frame

# ── MUSIC (numpy-synthesized, zero copyright) ───────────────────────
music:
  mood: "energetic"                   # driving gaming bed, not calm
  volume: 0.9

# ── PUBLISHING GRID (owner rule 2026-11-13: 4 Shorts EVERY day) ────
#
# ONE upload session per day (08:30 UTC = 10:30 Cairo, right after
# the Pacific-midnight quota reset) uploads ALL FOUR Shorts at once,
# each with publishAt = its grid slot below. No more 4 separate
# runs/day — one machine wake-up schedules the whole day.
schedule:
  timezone: "Africa/Cairo"
  slots: ["00:00", "08:00", "16:00", "20:00"]  # 4 per day, every day
  publish_lead_minutes: 25            # book only slots >=25 min out
  daily_run_utc: "08:30"              # the one daily session (UTC).
                                      # ALSO frozen in tools/gate.py —
                                      # keep both in sync

youtube:
  category_id: "20"                   # Gaming
  made_for_kids: false                # gameplay clips are not child-directed
  privacy: "public"
  default_language: "en"
  synthetic_media_disclosure: false   # real gameplay footage, not AI-generated
  # metadata templates — {n} is the forever-incrementing number.
  # OWNER RULE (2026-11-13): titles are HOOKS about XP + free skins.
  # NO map code, NO creator code in titles — codes live in the
  # burned-in bars + the description. Length always <= 95 chars.
  # OWNER RULE (2026-11-14): the word "Fortnite" is IN EVERY TITLE
  # (all combinations, both families) — a title without the game's
  # name can never ship. metadata.py enforces it at runtime too.
  title_templates:
    - "How to get FREE SKINS in Fortnite 🤑 #{n}"
    - "This Fortnite map levels you up FAST 🔥 #{n}"
    - "The EASIEST way to level up in Fortnite ⚡ #{n}"
    - "Fortnite free skins WITHOUT V-Bucks 💸 #{n}"
    - "This Fortnite map gives XP while you AFK 😴 #{n}"
    - "Max out your Fortnite Battle Pass in ONE day 🏆 #{n}"
    - "Level up your Fortnite Battle Pass for FREE 💯 #{n}"
    - "FREE skins are hiding in this Fortnite map 🎁 #{n}"
    - "Stop grinding — THIS Fortnite map does it for you 💡 #{n}"
    - "This Fortnite map should be ILLEGAL 🚫 #{n}"
    - "The BEST Fortnite map right now 🔥 #{n}"
    - "You won't believe this Fortnite map 😳 #{n}"
  # used ONLY when the source was found via an XP-map query (the
  # approved sample-1 niche) — never mislabels other footage.
  # Same 2026-11-14 rule: "Fortnite" in every single one.
  xp_title_templates:
    - "This Fortnite XP map = FREE Battle Pass 🤑 #{n}"
    - "Fortnite Level 100 in ONE DAY? 😱 #{n}"
    - "This Fortnite XP map gives FREE skins 🎁 #{n}"
    - "Fortnite AFK XP farm — levels while you sleep 😴 #{n}"
    - "FREE Fortnite XP map, NO timer needed ⏱️ #{n}"
    - "The XP map that breaks Fortnite 🔥 #{n}"
    - "This Fortnite XP map pays your Battle Pass 💰 #{n}"
    - "Unlimited Fortnite XP in this map 🤯 #{n}"

daily:
  quota_budget: 10000                 # YouTube Data API units/day
  # cost model: one session = 4 uploads x 1600 = 6,400 + a few
  # search/verify calls — comfortable margin under 10,000.

verify:
  enabled: true
  grace_days: 2
  scan_days: 10
  fallback_api: true

ingest:
  folder: "ingest"                    # rung 2: drop MP4s here manually

# ── CHANNEL BRANDING (applied by tools/update_channel.py) ───────────
# Owner rule 2026-11-13: new-channel energy — Fortnite-only copy.
# Edit HERE, then run the channel-branding workflow once to push it
# to YouTube (channels.update, 50 units, needs the OAuth secrets).
branding:
  description: |
    Daily Fortnite Creative XP maps 🔥

    Level up FAST and unlock free skins with the best XP maps — a new
    Short every single day. Follow so you never miss free XP!

    🛒 Support the channel: CREATOR CODE H15 (Fortnite item shop)
    🗺️ Featured map: 1789-8528-6429
  keywords:
    - fortnite
    - fortnite creative
    - fortnite xp map
    - xp map
    - free skins
    - level up fast
    - fortnite battle pass
    - fortnite clips
    - fortnite shorts
    - uefn
    - fortnite map gameplay
