# ══════════════════════════════════════════════════════════════════
#  FORT CLIP FACTORY — machine DNA
#  Clips REAL Fortnite map gameplay videos from YouTube into vertical
#  Shorts that carry the map code + creator code, first frame to last.
# ══════════════════════════════════════════════════════════════════

channel:
  name: "Fort Clip Factory"
  language: "en"                      # English titles, descriptions, tags
  niche: "Fortnite creative map clips"

# ── THE CODES (the whole point of the machine) ──────────────────────
codes:
  map_code: "7992-0068-2838"          # big top bar, every frame
  creator_code: "H15"                 # footer bar, every frame
  # OWNER RULE (2026-11-13): titles are pure HOOKS now — the map code
  # NEVER appears in a Short title (it lives in the description + the
  # burned-in top bar). show_in_title stays false forever.
  show_in_title: false
  show_in_description: true           # ...and the description

# ── SOURCING RULES (owner rules, 2026-11-10) ───────────────────────
sources:
  # OWNER RULE: source videos must be at most 11 months old. The API
  # call is born with publishedAfter = now - max_age_days, so older
  # footage can never even enter the candidate pool.
  max_age_days: 334                   # ~11 months, hard filter
  # OWNER RULE (2026-11-10): clip from NORMAL videos only, never from
  # Shorts. YouTube Shorts max out at 3 minutes, so a source of at
  # least 4 minutes can never be a Short — the machine mines a fresh
  # horizontal gameplay video and converts the window into a Short.
  min_duration_s: 240                 # ≥4 min = a real video, never a Short
  max_duration_s: 5400                # skip 3-hour marathons
  # OWNER RULE (2026-11-10, quality fix): a source file below this
  # height (144p/360p garbage, tiny archive mirrors) is rejected —
  # the ladder falls through to the next rung instead of shipping a
  # mushy Short. 720 is the floor; the download ladder prefers up
  # to 1440p for a crisp 1080x1920 re-render.
  min_source_height: 720              # hard quality floor for ANY rung
  # OWNER RULE: rotate different search phrasings, not one query.
  # Each run picks the next phrasing (round-robin seeded by the day).
  # OWNER RULE (2026-11-10, sample-1 approval): XP-map gameplay is the
  # preferred niche — 6 of 16 queries target XP maps so most footage
  # looks like the map the codes promote.
  queries:
    - "fortnite xp map gameplay"
    - "fortnite xp farm map"
    - "fortnite xp map"
    - "fortnite afk xp map gameplay"
    - "fortnite xp map code"
    - "fortnite xp farming gameplay"
    - "fortnite creative map"
    - "fortnite map"
    - "fortnite map gameplay"
    - "fortnite creative map gameplay"
    - "UEFN map gameplay"
    - "fortnite deathrun gameplay"
    - "fortnite edit course gameplay"
    - "fortnite horror map gameplay"
    - "best fortnite creative maps"
    - "fortnite parkour map gameplay"
  orders: ["date", "viewCount", "relevance"]   # mixed per run
  results_per_search: 25
  # never re-clip the same source video twice, ever
  no_repeat_sources: true

# ── CLIP ENGINE ─────────────────────────────────────────────────────
clip:
  # OWNER RULE (2026-11-10): Shorts must run at least 40-45 s — 20 s
  # was too low. Floor = 45 s.
  # OWNER RULE (2026-11-15): ceiling 120 -> 90 s. Facebook's Reels
  # API hard-caps reels at 90 s, and every Short must ship to ALL
  # platforms as the SAME file (YouTube Short + IG Reel + FB Reel).
  # Legacy banked clips over 90 s still publish to YouTube +
  # Instagram; they skip only the FB reel (logged).
  target_len_s: [45, 90]              # the Short's length window
  min_motion_score: 12.0              # reject near-static windows
  scene_threshold: 0.28               # ffmpeg scene-change sensitivity
  max_clips_per_run: 4                # owner rule 2026-11-13: 4 Shorts
                                      # per daily session (one upload
                                      # session schedules the day)

# ── PUBLISHING NEVER STOPS (owner rule 2026-11-22) ──────────────
#
# "Nothing published for more than 24 hours?! Don't EVER stop
# publishing every day, forever — even while harvesting. As long as
# there are at least 4 clips inside the bank, publishing runs."
#
# SUPERSEDES the 2026-11-21 harvest-first hold: the daily grid
# session, the hourly heal, the live-ladder fallback and the
# IG/FB/TikTok reel cross-poster (due + backfill) all run EVERY day
# in parallel with the stacking toward the 250-clip 2-month target.
# The hold is permanently OFF (hold_days: 0); keep it that way —
# publishing pauses only when the bank itself runs dry (< 4 clips),
# and then the live ladder feeds the grid while the harvest refills.
publishing:
  hold_days: 0              # OFF forever (owner 2026-11-22).
                             # ALSO frozen in tools/gate.py
                             # HOLD_HARVEST_DAYS — keep both in sync

# ── THE BANK (owner idea 2026-11-11): the monthly food run ──────────
# One IP, one long session: download + clip a month's worth of
# Shorts (sliced downloads, human pacing, cookie-jar rotation),
# bank them in GitHub artifacts, and let the daily runs do ONLY the
# API upload (OAuth is never IP-flagged). Blocked by the bot wall?
# The guard cron retries daily until it gets through, and the live
# ladder keeps publishing meanwhile.
#
# OWNER RULE (2026-11-14) — STACKING: the month must be provisioned
# with >= max_clips total ("at least 120 per month", exactly as the
# owner put it). One session renders only ~25 in its budget, so
# guard sessions APPEND to the same-month bank until
# bank.harvested_total >= max_clips — then the guard goes quiet for
# the rest of the month (refill_threshold is the drained-bank
# emergency only). The full month (~7 GB) ships as artifact PARTS
# (~4.2 GB each) — one artifact cannot exceed 5 GB.
#
# OWNER RULE (2026-11-18) — "THE BEGINNING OF THE MONTH": harvest
# ALL the videos and make the clips at the start of the month, so
# shorts are ready for the whole month and the machine NEVER uses
# old bank clips (they hurt the algorithm). Enforced three ways:
#   * the 1st-of-month cron fires at 00:29 UTC — BEFORE the day-1
#     08:33 session, so the new bank serves the month's FIRST clips;
#   * a leftover previous-month bank is RETIRED at rollover (never
#     published; the live ladder feeds the gap; src/bank.py stale/);
#   * the bank never plans clips past its own month boundary.
# Stacking guards (12:43 + 22:43 UTC daily) provision the full
# >= 124-clip month within the first ~3 days — GitHub's 6-hour job
# cap makes literally-one-day impossible, so "beginning of the
# month" = the first days, every month, without exception.
harvest:
  max_clips: 250            # OWNER RULE (2026-11-21): a 2-MONTH
                             # bank — "start harvesting for 2 months,
                             # not only one, because we will hit the
                             # bot wall". 4/day x ~62 days = ~250 clips
                             # of buffer before the wall can bite.
  slice_s: 300               # seconds of source grabbed per video
  pacing_s: [10, 35]         # human-ish pause between downloads
  days_ahead: 62             # OWNER RULE (2026-11-21): the feeding
                             # horizon — the bank plans slots across
                             # the NEXT 62 DAYS (2 months), and it is
                             # retired only when it ages past them.
                             # (Supersedes the 2026-11-18 same-month
                             # horizon: the 2-month buffer is worth
                             # more than month purity when the bot
                             # wall can stop a re-harvest cold.)
  budget_minutes: 305        # ~25 clips/session; leaves ~40 min of
                             # the 350-min job cap for the parts
                             # upload (~3 GB typ.)
  refill_threshold: 8        # drained-bank emergency (see above)
  topup_clips: 32             # emergency top-up size when it fires
  # OWNER RULE (2026-11-18) — "harvest ALL videos": the monthly pool
  # is a FULL sweep over all 16 query phrasings (16 x 100 quota
  # units, once a month), cached in state.bank.pool so the stacking
  # sessions reuse it at ZERO quota cost. The pool dies with the
  # bank at month rollover — every month sweeps fresh.
  sweep_results: 50           # results per query on the sweep (API max)
  pool_min: 40               # re-sweep only when the cached pool drops below
  pool_cap: 300               # pool entries kept in state (lean memory)

# ── TRANSFORMATION (this is what makes it OUR video) ────────────────
transform:
  width: 1080
  height: 1920                        # 9:16 vertical Short
  zoom: 1.08                          # slight push-in: not a raw crop
  strip_audio: true                   # original audio is DISCARDED
  fps: 30

# ── OVERLAYS (first frame to last, no gaps) ─────────────────────────
overlay:
  top_bar_height: 300                 # px of the 1920 canvas
  top_label: "MAP CODE"
  footer_bar_height: 240
  footer_label: "CREATOR CODE"
  accent: "#FFD400"                   # Fortnite-ish gold
  bar_opacity: 205                    # ~80% black bars
  pulse: false                        # static = readable in every frame

# ── MUSIC (numpy-synthesized, zero copyright) ───────────────────────
music:
  mood: "energetic"                   # driving gaming bed, not calm
  volume: 0.9

# ── PUBLISHING GRID (owner rule 2026-11-14: 4 Shorts EVERY day, ────
# ONE every 6 hours — 6+6+6+6 = 24h of even coverage; PHASE TUNED ─
# to the US audience, owner rule 2026-11-23) ──────────────────────
#
# A Short goes live every 6 hours around the clock — the 6+6+6+6
# rule from 2026-11-14 is UNTOUCHED (pure phase shift). The phase
# now aims each slot at US waking hours, where the Fortnite Shorts
# audience lives (Cairo ≈ US East + 7h; both regions' DST switches
# sit within ~2 weeks of each other, so the mapping holds all year):
#
#   01:00 Cairo  =   6 PM ET / 3 PM PT  PRIME evening + after school
#   07:00 Cairo  =  midnight ET / 9 PM PT  late-night East + PRIME West
#   13:00 Cairo  =   6 AM ET / 3 AM PT  early risers, feed stays warm
#   19:00 Cairo  =  noon ET / 9 AM PT  lunch scroll East + morning West
#
# The slot the OLD grid wasted (12:00 Cairo = 5 AM ET) is now the
# single most valuable one: 6 PM ET. The 08:33 UTC session books the
# next 4 open slots from now (at 10:33 Cairo: 13:00 + 19:00 today,
# 01:00 + 07:00 tomorrow).
schedule:
  timezone: "Africa/Cairo"
  slots: ["01:00", "07:00", "13:00", "19:00"]  # every 6 hours, 4/day
                                      # (US-tuned phase; keep in sync
                                      # with tools/gate.py GRID and the
                                      # daily-factory.yml comment)
  publish_lead_minutes: 25            # book only slots >=25 min out
  bookable_margin_minutes: 40          # audit 2026-11-18 (C5): the ONE
                                      # fillable-window rule shared by
                                      # tools/gate.py (BOOKABLE_MARGIN)
                                      # and bank.open_targets — the old
                                      # 25-vs-40 mismatch starved slots
                                      # in the blind zone when a heal
                                      # was cron-delayed
  daily_run_utc: "08:33"              # the one daily session (UTC).
                                      # ALSO frozen in tools/gate.py
                                      # AND the daily-factory cron —
                                      # keep all three in sync (the
                                      # :33 minute dodges GitHub's
                                      # :00/:30 cron congestion)

# ── CROSS-POSTING (owner rule 2026-11-15: the SAME Short goes to ──
# YouTube + Instagram Reel + Facebook Reel) ──────────────────────
#
# The hourly heal wakes at each 6-hour grid slot and, within minutes
# of the YouTube Short going live, pushes the same MP4 as a Reel to
# both platforms via Meta's resumable-upload endpoints (no public
# hosting needed). Failures retry hourly, never touch the YouTube
# pipeline, and alert after crosspost.max_attempts tries.
#
# ARMING: fill ig_user_id / fb_page_id here (or let auto-discovery
# fill state.crosspost_ids the hour the Meta-side setup completes).
# Tokens are the GitHub secrets IG_ACCESS_TOKEN / FB_ACCESS_TOKEN.
# An empty id or missing secret = that platform is cleanly OFF.
crosspost:
  enabled: true
  ig_user_id: ""        # Instagram professional account id (1784...)
  ig_username: "h15master"   # owner, 2026-11-15 — the discovery hint that
                        # picks @h15master when several IG accounts are
                        # visible to a token (business-owned or page-linked)
  fb_page_id: ""        # Facebook Page id — reels NEED a Page
  api_version: "v23.0"  # verified live 2026-11-15; ~2y runway
  max_attempts: 8       # hourly retries per reel before alert+give up
  hashtags: ["#fortnite", "#fortnitexp", "#fortnitemap", "#freeskins",
             "#fortnitebattlepass", "#gaming"]
  # CROSS-LINKS (owner rule 2026-11-15): every description carries the
  # other platforms — YouTube descriptions point at IG + FB; IG reel
  # captions at the YouTube twin + the FB page; FB reels at the
  # YouTube twin + the IG profile. Per-video reel permalinks are
  # appended to the YouTube description once the reels are live
  # (src/crosspost.py youtube_add_links).
  links:
    yt_short: "https://www.youtube.com/shorts/{video_id}"
    ig: "https://www.instagram.com/h15master/"
    fb: "https://www.facebook.com/131825308398327"
    tiktok: "https://www.tiktok.com/@h15master"
  # TIKTOK MIRROR (owner rule 2026-11-18): the fourth platform — same
  # MP4, same title. Unaudited app reality: every post is forced
  # SELF_ONLY (private) and @h15master must stay a private account
  # until the Content Posting API audit passes; THEN flip privacy to
  # PUBLIC_TO_EVERYONE here (TikTok rejects public privacy for
  # unaudited apps outright). Tokens: TIKTOK_ACCESS_TOKEN (24 h,
  # renewed daily by tiktok-token-refresh) + TIKTOK_CLIENT_KEY/SECRET
  # + TIKTOK_REFRESH_TOKEN (the rolling 365-day root).
  tiktok:
    enabled: true
    username: h15master
    privacy: SELF_ONLY
  # BACKFILL (owner rule 2026-11-15): mirror the already-public
  # catalogue so the three feeds look alike. Live-probed 2026-11-15:
  # Instagram reports NO content_publishing_limit (empty config) and
  # Facebook documents no reel cap — so per_hour paces the heal
  # (oldest first) purely for spam-safety, not quota.
  backfill:
    enabled: true
    per_hour: 4

youtube:
  category_id: "20"                   # Gaming
  made_for_kids: false                # gameplay clips are not child-directed
  privacy: "public"
  default_language: "en"
  synthetic_media_disclosure: false   # real gameplay footage, not AI-generated
  # ── THE TITLE ENGINE (owner rule 2026-11-22: "never duplicate
  # titles") — titles are COMBINATIONS, not templates. metadata.py
  # composes subject x predicate (+ an occasional lead) and burns
  # each used SKELETON forever against every title ever shipped
  # (published shorts + banked clips), so two titles can never copy
  # each other again — same-family repetition beyond the pool gets a
  # natural "(part k)" suffix. Still true, as before:
  #  * OWNER RULE (2026-11-13): titles are HOOKS — NO map code, NO
  #    creator code in titles; codes live in the burned-in bars +
  #    the description.
  #  * OWNER RULE (2026-11-14): the word "Fortnite" is IN EVERY
  #    SUBJECT — every combination carries the game's name.
  #  * Length always <= 95 chars (enforced in metadata.py).
  #  * xp_subjects/xp_predicates serve ONLY footage found via an
  #    XP-map query (the approved sample-1 niche) — never mislabels.
  # Parts lists must stay grammar-safe: every subject must pair
  # naturally with every predicate in its own family.
  title_engine:
    subjects:                       # generic family
      - "This Fortnite map"
      - "This secret Fortnite map"
      - "This cursed Fortnite map"
      - "This new Fortnite map"
      - "The best Fortnite map"
      - "This hidden Fortnite map"
      - "This Fortnite creative map"
      - "This Fortnite horror map"
      - "This tiny Fortnite map"
      - "This forgotten Fortnite map"
      - "This Fortnite gem"
    predicates:
      - "levels you up FAST ⚡"
      - "does the grinding for you 💡"
      - "should be BANNED 🚫"
      - "gives XP while you AFK 😴"
      - "feels illegal to play 😳"
      - "changes how you level up 🔥"
      - "hides free skins 🎁"
      - "plays itself 🤖"
      - "hides a secret nobody found 👀"
      - "is cursed and I love it 💀"
      - "made me forget the Battle Pass 🤯"
      - "rewards you for doing NOTHING 💯"
      - "should come with a warning ⚠️"
      - "is straight up FREE XP 🔥"
      - "never gets boring 🎮"
    xp_subjects:                     # XP family (XP-query footage only)
      - "This Fortnite XP map"
      - "This no-timer Fortnite XP map"
      - "This AFK Fortnite XP map"
      - "This secret Fortnite XP map"
